[package]
name = "flutter_surrealdb"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[workspace.dependencies]
surrealdb-core = { version = "=3.3.0" }
surrealdb-types = { version = "=3.3.0" }

[dependencies]
flutter_rust_bridge = { version = "=2.12.0", features = ["log"] }
tokio = { version = "1.47.1", features = ["rt", "sync", "time"] }
surrealdb-types = { workspace = true }
surrealdb-rpc = { version = "=3.3.0" }
# The client-managed transaction hooks of RpcProtocol (get_tx / set_tx /
# begin / commit / cancel) are typed on the datastore layer's Transaction,
# which core re-exports only as pub(crate); depend on these crates directly
# to name those types from outside core.
surrealdb-kvs = { version = "=3.3.0" }
surrealdb-datastore = { version = "=3.3.0" }
# Used to rebuild the handful of RPC statement handlers that must honor a
# client-managed transaction (see connect.rs).
surrealdb-sql = { version = "=3.3.0" }
serde = { version = "1.0.219", features = ["derive"] }
surrealdb-core = { workspace = true, features = ["kv-mem", "allocator"] }
channel = { version = "2.3.1", package = "async-channel" }
anyhow = "1.0.98"
serde_json = "1.0.142"
futures = "0.3.28"
uuid = "1.8.0"
arc-swap = "1.7.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
lazy_static = "1.4.0"
dashmap   = "6.1.0"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
surrealdb-core = { workspace = true, features = ["kv-rocksdb"] }

[target.'cfg(any(target_os = "android", target_os = "windows", target_os = "linux", target_os = "macos", target_os = "ios"))'.dependencies]
surrealdb-core = { workspace = true, features = ["kv-surrealkv"] }

#wasm32-unknown-unknown
[target.'cfg(target_arch = "wasm32")'.dependencies]
surrealdb-core = { workspace = true, features = ["kv-indxdb"] }


# [target.wasm32-unknown-unknown.dependencies]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

[profile.dev]
# The engine spends its time inside surrealdb-core and friends; opt-level 1
# codegen there measurably slows every query in debug builds (the 3.3 crate
# split amplifies this). Optimizing the hot crates keeps debug builds
# debuggable (line tables only) without the query cost.
opt-level = 1
debug = "line-tables-only"
panic = "unwind"

[profile.dev.package.surrealdb-core]
opt-level = 3

[profile.dev.package.surrealdb-idx]
opt-level = 3

[profile.dev.package.surrealdb-datastore]
opt-level = 3

[profile.dev.package.surrealdb-kvs]
opt-level = 3

[profile.dev.package.surrealdb-expr]
opt-level = 3

[profile.dev.package.surrealdb-collections]
opt-level = 3

[build-dependencies]
cargo-lock = "10.0.1"
flutter_rust_bridge_codegen = "=2.11.1"
